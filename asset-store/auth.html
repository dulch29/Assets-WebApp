<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandGun ID — Sign In</title>
  <meta name="description" content="Sign in with your account to access downloads and publisher tools." />
  <link rel="stylesheet" href="css/store.css" />
</head>
<body style="background: var(--as-bg-canvas);">

  <!-- Top Dark Navbar & Subnav -->
  <header id="store-header"></header>

  <!-- Auth Container -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem;">
    
    <div style="width: 100%; max-width: 400px; background: #FFFFFF; border: 1px solid var(--as-border); border-radius: var(--as-radius); padding: 2.5rem 2rem; box-shadow: var(--as-shadow);">
      
      <!-- Brand Logo -->
      <div style="text-align: center; margin-bottom: 2rem;">
        <div style="font-weight: 800; font-size: 1.25rem; color: #111827; margin-bottom: 0.25rem;">HandGun ID</div>
        <div id="auth-subtitle" style="font-size: 0.8125rem; color: var(--as-text-muted);">Sign in to access HandGun Store</div>
      </div>

      <!-- Tab Switcher -->
      <div style="display: flex; border-bottom: 1px solid var(--as-border); margin-bottom: 1.75rem;">
        <button id="tab-login" style="flex: 1; padding: 0.6rem 0; font-size: 0.875rem; font-weight: 600; color: var(--as-primary); border: none; background: none; border-bottom: 2px solid var(--as-primary); cursor: pointer;">
          Sign In
        </button>
        <button id="tab-register" style="flex: 1; padding: 0.6rem 0; font-size: 0.875rem; font-weight: 500; color: var(--as-text-muted); border: none; background: none; border-bottom: 2px solid transparent; cursor: pointer;">
          Create Account
        </button>
      </div>

      <!-- Google Sign In -->
      <div style="margin-bottom: 1.5rem;">
        <button id="google-auth-btn" type="button" class="as-btn as-btn-outline" style="width: 100%; justify-content: center; font-size: 0.8125rem; padding: 0.6rem;">
          Continue with Google
        </button>
        <div style="display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0 0.5rem; color: var(--as-text-muted); font-size: 0.75rem;">
          <div style="flex: 1; height: 1px; background: var(--as-border);"></div>
          <span>OR</span>
          <div style="flex: 1; height: 1px; background: var(--as-border);"></div>
        </div>
      </div>

      <!-- LOGIN FORM -->
      <form id="login-form" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: #27272A; margin-bottom: 0.35rem;">Email</label>
          <input type="email" id="login-email" required value="developer@unity.com" style="width: 100%; border: 1px solid var(--as-border); padding: 0.55rem 0.75rem; border-radius: var(--as-radius-sm); font-size: 0.8125rem; outline: none;" />
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 0.35rem;">
            <label style="font-size: 0.8125rem; font-weight: 600; color: #27272A;">Password</label>
            <a href="#" onclick="alert('Demo mode: any password is valid'); return false;" style="font-size: 0.75rem; color: var(--as-primary); text-decoration: none;">Forgot?</a>
          </div>
          <input type="password" id="login-password" required value="password123" style="width: 100%; border: 1px solid var(--as-border); padding: 0.55rem 0.75rem; border-radius: var(--as-radius-sm); font-size: 0.8125rem; outline: none;" />
        </div>

        <button type="submit" class="as-btn as-btn-primary" style="width: 100%; padding: 0.65rem; margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <!-- REGISTER FORM -->
      <form id="register-form" style="display: none; flex-direction: column; gap: 1rem;">
        <div>
          <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: #27272A; margin-bottom: 0.35rem;">Username</label>
          <input type="text" id="reg-name" placeholder="DevCreator" required style="width: 100%; border: 1px solid var(--as-border); padding: 0.55rem 0.75rem; border-radius: var(--as-radius-sm); font-size: 0.8125rem; outline: none;" />
        </div>

        <div>
          <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: #27272A; margin-bottom: 0.35rem;">Email</label>
          <input type="email" id="reg-email" placeholder="dev@company.com" required style="width: 100%; border: 1px solid var(--as-border); padding: 0.55rem 0.75rem; border-radius: var(--as-radius-sm); font-size: 0.8125rem; outline: none;" />
        </div>

        <div>
          <label style="display: block; font-size: 0.8125rem; font-weight: 600; color: #27272A; margin-bottom: 0.35rem;">Password</label>
          <input type="password" id="reg-password" placeholder="At least 6 characters" required style="width: 100%; border: 1px solid var(--as-border); padding: 0.55rem 0.75rem; border-radius: var(--as-radius-sm); font-size: 0.8125rem; outline: none;" />
        </div>

        <button type="submit" class="as-btn as-btn-primary" style="width: 100%; padding: 0.65rem; margin-top: 0.5rem;">
          Create Account
        </button>
      </form>

    </div>
  </main>

  <!-- Clean Footer -->
  <footer class="as-footer">
    <div style="max-width: 1440px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-weight: 800; color: #FFFFFF;">HandGun <span style="font-size: 0.75rem; color: #FF6000; font-weight: 600;">ASSETS</span></div>
      <div style="font-size: 0.75rem; color: #71717A;">© 2026 HandGun Asset Store. All rights reserved.</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module">
    import { initCommonUI } from "./js/common-ui.js";
    import { login, register, loginWithGoogle } from "./js/auth.js";
    import { showToast } from "./js/store.js";

    initCommonUI('all', 'auth');

    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get("redirect") || "account.html";
    const mode = urlParams.get("mode") || "login";

    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const subtitle = document.getElementById("auth-subtitle");

    function setMode(isLogin) {
      if (isLogin) {
        tabLogin.style.color = "var(--as-primary)";
        tabLogin.style.borderBottomColor = "var(--as-primary)";
        tabLogin.style.fontWeight = "600";
        tabRegister.style.color = "var(--as-text-muted)";
        tabRegister.style.borderBottomColor = "transparent";
        tabRegister.style.fontWeight = "500";
        loginForm.style.display = "flex";
        registerForm.style.display = "none";
        subtitle.textContent = "Sign in to access the Asset Store";
      } else {
        tabRegister.style.color = "var(--as-primary)";
        tabRegister.style.borderBottomColor = "var(--as-primary)";
        tabRegister.style.fontWeight = "600";
        tabLogin.style.color = "var(--as-text-muted)";
        tabLogin.style.borderBottomColor = "transparent";
        tabLogin.style.fontWeight = "500";
        registerForm.style.display = "flex";
        loginForm.style.display = "none";
        subtitle.textContent = "Create an account to publish and collect assets";
      }
    }

    tabLogin.onclick = () => setMode(true);
    tabRegister.onclick = () => setMode(false);

    if (mode === "register") setMode(false);

    document.getElementById("google-auth-btn").onclick = async () => {
      const res = await loginWithGoogle();
      if (res && res.success) {
        showToast("Signed in successfully.", "success");
        setTimeout(() => window.location.href = redirectUrl, 800);
      }
    };

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const pass = document.getElementById("login-password").value;
      const res = await login(email, pass);
      if (res && res.success) {
        showToast("Signed in successfully.", "success");
        setTimeout(() => window.location.href = redirectUrl, 800);
      } else {
        showToast("Authentication failed.", "error");
      }
    };

    registerForm.onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById("reg-name").value;
      const email = document.getElementById("reg-email").value;
      const pass = document.getElementById("reg-password").value;
      const res = await register(email, pass, name);
      if (res && res.success) {
        showToast("Account created successfully.", "success");
        setTimeout(() => window.location.href = redirectUrl, 800);
      } else {
        showToast("Registration failed.", "error");
      }
    };
  </script>
</body>
</html>

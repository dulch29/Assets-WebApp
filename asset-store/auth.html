<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandGun ID — Sign In</title>
  <meta name="description" content="Sign in with your account to access downloads and publisher tools." />
  <link rel="stylesheet" href="css/store.css" />
</head>
<body style="background: radial-gradient(ellipse at 60% 0%, #1a0a00 0%, #0a0a0d 55%, #030305 100%); min-height: 100vh; --accent-primary: #FF6000;">

  <!-- Top Dark Navbar & Subnav -->
  <header id="store-header"></header>

  <!-- Auth Container -->
  <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 4rem 1.5rem;">
    
    <!-- Auth Glass Panel -->
    <div class="hq-glass-modal-content hq-scale-up" style="max-width: 420px; width: 100%; margin: 0 auto; background: rgba(255,255,255,0.08); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.18); border-radius: 20px; padding: clamp(2rem, 4vw, 3rem); box-shadow: 0 8px 32px 0 rgba(0,0,0,0.37);">

      <!-- Brand Logo -->
      <div class="hq-slide-down" style="text-align: center; margin-bottom: 2rem;">
        <div style="font-weight: 800; font-size: 1.5rem; color: #FFFFFF; margin-bottom: 0.35rem; letter-spacing: -0.02em;">HandGun
          <span style="font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; background: rgba(255,96,0,0.2); color: #FF771C; border: 1px solid rgba(255,96,0,0.4); padding: 0.15rem 0.45rem; border-radius: 4px; vertical-align: middle;">ID</span>
        </div>
        <div id="auth-subtitle" style="font-size: 0.8125rem; color: rgba(255,255,255,0.55);">Sign in to access HandGun Store</div>
      </div>

      <!-- Tab Switcher — navigation kit tabs -->
      <div class="hq-tabs-list" style="margin-bottom: 1.75rem; border-bottom-color: rgba(255,255,255,0.12);">
        <button id="tab-login" class="hq-tabs-trigger active" style="flex: 1; justify-content: center;">Sign In</button>
        <button id="tab-register" class="hq-tabs-trigger" style="flex: 1; justify-content: center;">Create Account</button>
      </div>

      <!-- Google Sign In -->
      <div style="margin-bottom: 1.5rem;">
        <button id="google-auth-btn" type="button" class="hq-glass-modal-btn hq-glass-modal-btn-secondary" style="width: 100%;">
          <svg width="18" height="18" viewBox="0 0 24 24" style="margin-right: 0.5rem;"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
          Continue with Google
        </button>
        <div style="display: flex; align-items: center; gap: 0.75rem; margin: 1.25rem 0 0.5rem; color: rgba(255,255,255,0.35); font-size: 0.75rem;">
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.12);"></div>
          <span>OR</span>
          <div style="flex: 1; height: 1px; background: rgba(255,255,255,0.12);"></div>
        </div>
      </div>

      <!-- LOGIN FORM — glass-modal kit -->
      <form id="login-form" class="hq-glass-modal-form">
        <div class="hq-glass-modal-field">
          <label class="hq-glass-modal-label" for="login-email">Email</label>
          <input type="email" id="login-email" class="hq-glass-modal-input" required value="developer@unity.com" placeholder="you@example.com" />
        </div>
        <div class="hq-glass-modal-field">
          <div style="display: flex; justify-content: space-between; align-items: center;">
            <label class="hq-glass-modal-label" for="login-password">Password</label>
            <a href="#" onclick="alert('Demo mode: any password is valid'); return false;" style="font-size: 0.75rem; color: var(--accent-primary, #00b4d8); text-decoration: none;">Forgot?</a>
          </div>
          <input type="password" id="login-password" class="hq-glass-modal-input" required value="password123" placeholder="Enter password" />
        </div>
        <button type="submit" class="hq-glass-modal-btn hq-glass-modal-btn-primary" style="margin-top: 0.5rem;">
          Sign In
        </button>
      </form>

      <!-- REGISTER FORM — glass-modal kit -->
      <form id="register-form" class="hq-glass-modal-form" style="display: none;">
        <div class="hq-glass-modal-field">
          <label class="hq-glass-modal-label" for="reg-name">Username</label>
          <input type="text" id="reg-name" class="hq-glass-modal-input" placeholder="DevCreator" required />
        </div>
        <div class="hq-glass-modal-field">
          <label class="hq-glass-modal-label" for="reg-email">Email</label>
          <input type="email" id="reg-email" class="hq-glass-modal-input" placeholder="dev@company.com" required />
        </div>
        <div class="hq-glass-modal-field">
          <label class="hq-glass-modal-label" for="reg-password">Password</label>
          <input type="password" id="reg-password" class="hq-glass-modal-input" placeholder="At least 6 characters" required />
        </div>
        <button type="submit" class="hq-glass-modal-btn hq-glass-modal-btn-primary" style="margin-top: 0.5rem;">
          Create Account
        </button>
      </form>

    </div>
  </main>

  <!-- Clean Footer -->
  <footer class="as-footer" style="border-top-color: rgba(255,255,255,0.06);">
    <div style="max-width: 1440px; margin: 0 auto; padding: 0 1.5rem; display: flex; justify-content: space-between; align-items: center;">
      <div style="font-weight: 800; color: #FFFFFF;">HandGun <span style="font-size: 0.75rem; color: #FF6000; font-weight: 600;">ASSETS</span></div>
      <div style="font-size: 0.75rem; color: #71717A;">© 2026 HandGun Asset Store. All rights reserved.</div>
    </div>
  </footer>

  <!-- Scripts -->
  <script type="module">
    import { initCommonUI } from "./js/common-ui.js";
    import { login, register, loginWithGoogle } from "./js/auth.js";
    import { showToast } from "./js/store.js";

    initCommonUI('all', 'auth');

    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get("redirect") || "account.html";
    const mode = urlParams.get("mode") || "login";

    const tabLogin = document.getElementById("tab-login");
    const tabRegister = document.getElementById("tab-register");
    const loginForm = document.getElementById("login-form");
    const registerForm = document.getElementById("register-form");
    const subtitle = document.getElementById("auth-subtitle");

    function setMode(isLogin) {
      if (isLogin) {
        tabLogin.classList.add("active");
        tabRegister.classList.remove("active");
        loginForm.style.display = "flex";
        registerForm.style.display = "none";
        subtitle.textContent = "Sign in to access the Asset Store";
      } else {
        tabRegister.classList.add("active");
        tabLogin.classList.remove("active");
        registerForm.style.display = "flex";
        loginForm.style.display = "none";
        subtitle.textContent = "Create an account to publish and collect assets";
      }
    }

    tabLogin.onclick = () => setMode(true);
    tabRegister.onclick = () => setMode(false);

    if (mode === "register") setMode(false);

    document.getElementById("google-auth-btn").onclick = async () => {
      const res = await loginWithGoogle();
      if (res && res.success) {
        showToast("Signed in successfully.", "success");
        setTimeout(() => window.location.href = redirectUrl, 800);
      }
    };

    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value;
      const pass = document.getElementById("login-password").value;
      const res = await login(email, pass);
      if (res && res.success) {
        showToast("Signed in successfully.", "success");
        setTimeout(() => window.location.href = redirectUrl, 800);
      } else {
        showToast("Authentication failed.", "error");
      }
    };

    registerForm.onsubmit = async (e) => {
      e.preventDefault();
      const name = document.getElementById("reg-name").value;
      const email = document.getElementById("reg-email").value;
      const pass = document.getElementById("reg-password").value;
      const res = await register(email, pass, name);
      if (res && res.success) {
        showToast("Account created successfully.", "success");
        setTimeout(() => window.location.href = redirectUrl, 800);
      } else {
        showToast("Registration failed.", "error");
      }
    };
  </script>
</body>
</html>

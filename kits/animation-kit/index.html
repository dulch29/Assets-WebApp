<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Kit</title>
    <link rel="stylesheet" href="components/animations.css">
    <style>
        body { font-family: system-ui; background: linear-gradient(135deg, #05070C 0%, #161D2B 100%); color: white; margin: 0; padding: 2rem; }
        .demo { max-width: 1200px; margin: 0 auto; }
        h1 { color: #6EE7B7; margin-bottom: 3rem; }
        h2 { color: #38BDF8; margin: 2rem 0 1rem; }
        .demo-section { margin-bottom: 3rem; }
        .demo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; }
        .demo-box { background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 0.5rem; padding: 2rem; text-align: center; }
    </style>
</head>
<body>
    <div class="demo">
        <h1>Animation Kit</h1>
        <div class="demo-section">
            <h2>Fade Animations</h2>
            <div class="demo-grid">
                <div class="demo-box hq-fade-in">Fade In</div>
            </div>
        </div>
        <div class="demo-section">
            <h2>Slide Animations</h2>
            <div class="demo-grid">
                <div class="demo-box hq-slide-up">Slide Up</div>
                <div class="demo-box hq-slide-down">Slide Down</div>
                <div class="demo-box hq-slide-left">Slide Left</div>
                <div class="demo-box hq-slide-right">Slide Right</div>
            </div>
        </div>
        <div class="demo-section">
            <h2>Scale Animations</h2>
            <div class="demo-grid">
                <div class="demo-box hq-scale-up">Scale Up</div>
                <div class="demo-box hq-scale-down">Scale Down</div>
            </div>
        </div>
        <div class="demo-section">
            <h2>Continuous Animations</h2>
            <div class="demo-grid">
                <div class="demo-box hq-bounce">Bounce</div>
                <div class="demo-box hq-pulse">Pulse</div>
                <div class="demo-box hq-spin">Spin</div>
            </div>
        </div>
        <div class="demo-section">
            <h2>Hover Effects</h2>
            <div class="demo-grid">
                <div class="demo-box hq-hover-lift">Hover Lift</div>
                <div class="demo-box hq-hover-scale">Hover Scale</div>
                <div class="demo-box hq-hover-glow">Hover Glow</div>
            </div>
        </div>
        <div class="demo-section">
            <h2>Stagger Animation</h2>
            <div class="hq-stagger demo-grid">
                <div class="demo-box hq-slide-up">Item 1</div>
                <div class="demo-box hq-slide-up">Item 2</div>
                <div class="demo-box hq-slide-up">Item 3</div>
                <div class="demo-box hq-slide-up">Item 4</div>
            </div>
        </div>
    </div>
</body>
</html>

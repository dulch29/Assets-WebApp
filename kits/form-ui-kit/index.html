<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form UI Kit — All-Round UI Components</title>
    <style>
        /* ============================================
           DESIGN SYSTEM FOUNDATION
           ============================================ */
        :root {
            /* Surface layers - deep tonal foundation */
            --surface-0: #05070C;
            --surface-1: #0A0D12;
            --surface-2: #0F131C;
            --surface-3: #161D2B;
            --surface-4: #1E2636;
            --surface-5: #2A3142;

            /* Accent colors - luminous, high saturation */
            --accent-primary: #3B6DFF;
            --accent-primary-hover: #5B85FF;
            --accent-success: #6EE7B7;
            --accent-danger: #FF6B6B;
            --accent-warning: #FFA94D;

            /* Text hierarchy */
            --text-primary: rgba(255, 255, 255, 0.95);
            --text-secondary: rgba(255, 255, 255, 0.70);
            --text-tertiary: rgba(255, 255, 255, 0.45);
            --text-disabled: rgba(255, 255, 255, 0.30);

            /* Typography scale - fluid sizing */
            --font-display: clamp(2.5rem, 5vw, 4rem);
            --font-h1: clamp(2rem, 4vw, 3rem);
            --font-h2: clamp(1.5rem, 3vw, 2rem);
            --font-h3: clamp(1.25rem, 2.5vw, 1.5rem);
            --font-body-lg: clamp(1.125rem, 2vw, 1.25rem);
            --font-body: clamp(1rem, 1.5vw, 1.125rem);
            --font-body-sm: clamp(0.875rem, 1.25vw, 1rem);
            --font-caption: clamp(0.75rem, 1vw, 0.875rem);

            /* Font families */
            --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'SF Mono', Monaco, 'Cascadia Code', monospace;

            /* Spacing scale */
            --space-xs: clamp(0.25rem, 0.5vw, 0.5rem);
            --space-sm: clamp(0.5rem, 1vw, 0.75rem);
            --space-md: clamp(0.75rem, 1.5vw, 1rem);
            --space-lg: clamp(1rem, 2vw, 1.5rem);
            --space-xl: clamp(1.5rem, 3vw, 2rem);
            --space-2xl: clamp(2rem, 4vw, 3rem);
            --space-3xl: clamp(3rem, 6vw, 4rem);

            /* Border radius */
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;

            /* Shadows */
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 4px 6px rgba(0, 0, 0, 0.4);
            --shadow-focus: 0 0 0 3px rgba(59, 109, 255, 0.3);
        }

        /* ============================================
           BASE STYLES
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-sans);
            font-size: var(--font-body);
            line-height: 1.6;
            color: var(--text-primary);
            background: linear-gradient(135deg,
                #05070C 0%,
                #0A0D12 25%,
                #0F131C 50%,
                #0A0D12 75%,
                #05070C 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ============================================
           DEMO PAGE LAYOUT
           ============================================ */
        .demo-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--space-3xl) var(--space-lg);
        }

        .demo-header {
            text-align: center;
            margin-bottom: var(--space-3xl);
        }

        .demo-title {
            font-size: var(--font-display);
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: var(--space-md);
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-success));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .demo-subtitle {
            font-size: var(--font-body-lg);
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        .demo-section {
            margin-bottom: var(--space-3xl);
            padding: var(--space-2xl);
            background: var(--surface-2);
            border-radius: var(--radius-xl);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .section-title {
            font-size: var(--font-h2);
            font-weight: 600;
            margin-bottom: var(--space-sm);
            color: var(--text-primary);
        }

        .section-description {
            font-size: var(--font-body);
            color: var(--text-secondary);
            margin-bottom: var(--space-xl);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--space-lg);
        }

        /* ============================================
           FORM COMPONENTS - BASE
           ============================================ */

        /* Form group container */
        .hq-form-group {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }

        /* Label */
        .hq-label {
            font-size: var(--font-body);
            font-weight: 500;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: var(--space-xs);
        }

        .hq-label-required {
            color: var(--accent-danger);
        }

        /* Helper text */
        .hq-helper-text {
            font-size: var(--font-body-sm);
            color: var(--text-secondary);
        }

        /* Error message */
        .hq-error-text {
            font-size: var(--font-body-sm);
            color: var(--accent-danger);
            display: none;
        }

        .hq-form-group.has-error .hq-error-text {
            display: block;
        }

        /* Success message */
        .hq-success-text {
            font-size: var(--font-body-sm);
            color: var(--accent-success);
            display: none;
        }

        .hq-form-group.has-success .hq-success-text {
            display: block;
        }

        /* ============================================
           TEXT INPUT
           ============================================ */
        .hq-input {
            font-family: var(--font-sans);
            font-size: var(--font-body);
            color: var(--text-primary);
            background: var(--surface-4);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: var(--radius-md);
            padding: clamp(0.625rem, 1.5vw, 0.75rem) clamp(0.875rem, 2vw, 1rem);
            width: 100%;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            outline: none;
        }

        .hq-input::placeholder {
            color: var(--text-tertiary);
        }

        .hq-input:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.2);
        }

        .hq-input:focus {
            border-color: var(--accent-primary);
            box-shadow: var(--shadow-focus);
            background: var(--surface-5);
        }

        .hq-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background: var(--surface-3);
        }

        /* Error state */
        .hq-form-group.has-error .hq-input {
            border-color: var(--accent-danger);
        }

        .hq-form-group.has-error .hq-input:focus {
            box-shadow: 0 0 0 3px rgba(255, 107, 107, 0.3);
        }

        /* Success state */
        .hq-form-group.has-success .hq-input {
            border-color: var(--accent-success);
        }

        .hq-form-group.has-success .hq-input:focus {
            box-shadow: 0 0 0 3px rgba(110, 231, 183, 0.3);
        }

        /* Input with icon */
        .hq-input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .hq-input-icon {
            position: absolute;
            left: clamp(0.75rem, 1.5vw, 1rem);
            width: 1.25em;
            height: 1.25em;
            color: var(--text-tertiary);
            pointer-events: none;
        }

        .hq-input-wrapper .hq-input {
            padding-left: clamp(2.5rem, 5vw, 3rem);
        }

===================================*/
    </style>
</head>
